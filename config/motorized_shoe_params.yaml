# CAN Bus Configuration
can_imu_interface: "can1"
can_elmo_interface: "can0"

# IMU CAN IDs (Left/Right shoes)
imu_left_can_ids:
  rotation_vector: 0x110
  accelerometer: 0x111
  gyroscope: 0x112
  magnetometer: 0x113

imu_right_can_ids:
  rotation_vector: 0x120
  accelerometer: 0x121
  gyroscope: 0x122
  magnetometer: 0x123

# ELMO CANopen Node IDs (configurable per shoe)
elmo_node_ids:
  left: 126
  right: 127

# Control loop frequency (Hz)
loop_frequency: 1000

# Gait Detection Configuration
gait_detection:
  # Rate at which the gait FSM is stepped = the IMU message rate (~100 Hz), NOT
  # the 1 kHz control loop: the gait node only calls the FSM on a new IMU
  # msg_count. This value converts all ms-based FSM windows (min_swing_dwell_ms,
  # state_timeout_ms, MA group delay) into sample counts, so a wrong value
  # scales every one of those windows.
  sampling_frequency: 100.0
  use_both_feet: false

  # Velocity commands per continuous gait phase (counts/sec). The two-state FSM
  # emits only "Stance" and "Swing", so the map keys on those (Swing drives the
  # foot, Stance holds at 0). The old MSt/HO/TSt/TO/HS keys are obsolete.
  velocity_map:
    Stance: 0
    Swing: 150000

  # FSM resync timeout (ms). If a state dwells longer than max(this, ~1.5x the
  # recent HS->HS cycle period) with no event, both gyro peak detectors and the
  # cycle clocks reset so a single missed gyro peak cannot stall the machine.
  state_timeout_ms: 2000

  # Thresholds for gait event detection (gyro thresholds are in rad/s). The
  # two-state FSM uses only hs_threshold + to_threshold (the gyro negative peaks)
  # and the swing dwell gate.
  thresholds:
    hs_threshold: -1.3963       # heel-strike gyro_z negative peak
    to_threshold: -2.0944       # toe-off gyro_z negative peak
    # Minimum dwell in Swing before a heel strike may fire, so the HS negative-peak
    # detector cannot latch onto an early-swing gyro dip.
    min_swing_dwell_ms: 330
    # Optional HS accept gate: require a RAW |accel| impact spike (m/s^2) during the
    # swing dwell before accepting a heel strike. Uses raw accel, NOT gravity-removed
    # free accel. KEEP OFF with this hardware: across the Jul 8 + Jul 13 logs (~55
    # heel strikes, both feet) real-HS impacts run 10-19 m/s^2 (only ~20% reach 20)
    # while mid-swing shake peaks hit 20-44, often exceeding the HS impact itself --
    # no threshold separates them, so the veto blocks real heel strikes and/or gets
    # pre-armed by swing shake. (Context: a mid-swing gyro dip in the 20260708_162943
    # log fired a false HS -> slip mid-swing; that dip is deeper than the true HS
    # trough on the filtered gyro, so hs_threshold tuning can't fix it either.)
    hs_accel_veto: false
    hs_impact_threshold: 20.0
    # DEPRECATED (six-state FSM): parsed for compatibility but unused.
    ts_threshold: -0.5236
    ho_threshold: -0.15
    swing_gyro_threshold: 0.8727
    midstance_threshold: 3.0

  # Moving-average window (samples) on gyro_z feeding the FSM. The (window-1)/2-
  # sample group delay is compensated for in back-dated event timestamps.
  ma_window: 5
  # DEPRECATED: gravity estimation is no longer on the FSM path (the gyro-only
  # two-state machine doesn't use free acceleration). Parsed but unused.
  gravity_calib_samples: 60

# ELMO CANopen Configuration
elmo_config:
  mode_of_operation: 0x6060
  target_velocity: 0x60FF
  status_word: 0x6041
  control_word: 0x6040
  error_code: 0x603F
  nmt_operational: 0x01
  sdo_rx_offset: 0x580
  sdo_tx_offset: 0x600
  sdo_timeout: 300
  can_write_timeout: 100
  profile_acceleration: 1000000
  profile_deceleration: 1000000

# Slip Perturbation (used by motorized_shoe_slip_app)
# Two modes selectable from keyboard, both one-shot per keypress:
#   mode1_key (AfterHS, backward slip): fires `mode1_delay_after_hs_ms` after the
#                next HS event.
#   mode2_key (BeforeTO, forward slip): PREDICTED, HS-anchored. On the next HS it
#                schedules the slip for t_HS + max(0, stance_est - to_slip_lead_ms)
#                so the -velocity burst lands ~to_slip_lead_ms before the predicted
#                toe-off. stance_est is a running average of measured (TO-HS)
#                stance times; a newer HS before firing cancels and reschedules.
slip_perturbation:
  enabled: true
  foot: "Right"
  slip_velocity: 150000
  slip_duration_ms: 500
  mode1_delay_after_hs_ms: 0
  # Forward-slip lead before the predicted toe-off (ms).
  to_slip_lead_ms: 50
  # Number of recent cycles averaged into the stance estimate.
  stance_est_window: 2
  # DEPRECATED: superseded by to_slip_lead_ms. Parsed but unused.
  mode2_delay_after_mst_ms: 200
  # Drive profile acceleration/deceleration in slip mode (counts/sec^2).
  # Init default is 1e6 → ~150 ms ramp for a 150k slip, so most of a short
  # burst is spent ramping. 1e7 (~15 ms ramp) makes the slip onset
  # essentially instantaneous relative to the gait event.
  slip_profile_acceleration: 10000000
  mode1_key: "1"
  mode2_key: "2"

# Logging Configuration
logging:
  imu_data_log: false
  gait_phase_log: true
  elmo_command_log: true
  elmo_status_log: true
