# CAN Bus Configuration
can_imu_interface: "can1"
can_elmo_interface: "can0"

# IMU CAN IDs (Left/Right shoes)
imu_left_can_ids:
  rotation_vector: 0x110
  accelerometer: 0x111
  gyroscope: 0x112
  magnetometer: 0x113
  status: 0x11F        # 1 Hz node health frame (firmware/teensy_imu_can)

imu_right_can_ids:
  rotation_vector: 0x120
  accelerometer: 0x121
  gyroscope: 0x122
  magnetometer: 0x123
  status: 0x12F

# ELMO CANopen Node IDs (configurable per shoe)
elmo_node_ids:
  left: 126
  right: 127

# Control loop frequency (Hz)
loop_frequency: 1000

# IMU freshness watchdog (ms). A foot whose newest IMU frame is older than this
# is reported STALE on the console (and in the imu_*_age_ms CSV columns), and
# the slip app refuses to arm / disarms when the slip foot's IMU is stale.
# Nominal frame period is 10 ms; the largest healthy gap seen is ~70 ms. Both
# IMUs have dropped out mid-run (right 2026-09-08, left 2026-09-11).
imu_stale_ms: 100

# Gait Detection Configuration
gait_detection:
  # Rate at which the gait FSM is stepped = the IMU message rate (~100 Hz), NOT
  # the 1 kHz control loop: the gait node only calls the FSM on a new IMU
  # msg_count. This value converts all ms-based FSM windows (min_swing_dwell_ms,
  # state_timeout_ms, MA group delay) into sample counts, so a wrong value
  # scales every one of those windows.
  sampling_frequency: 100.0
  use_both_feet: false

  # Velocity commands per continuous gait phase (counts/sec). The two-state FSM
  # emits only "Stance" and "Swing", so the map keys on those (Swing drives the
  # foot, Stance holds at 0). The old MSt/HO/TSt/TO/HS keys are obsolete.
  velocity_map:
    Stance: 0
    Swing: 150000

  # FSM resync timeout (ms). If a state dwells longer than max(this, ~1.5x the
  # recent HS->HS cycle period) with no event, both gyro peak detectors and the
  # cycle clocks reset so a single missed gyro peak cannot stall the machine.
  state_timeout_ms: 2000

  # Thresholds for gait event detection (gyro thresholds are in rad/s). The
  # two-state FSM uses only hs_threshold + to_threshold (the gyro negative peaks)
  # and the swing dwell gate.
  thresholds:
    hs_threshold: -1.3963       # heel-strike gyro_z negative peak
    to_threshold: -1.75         # toe-off gyro_z negative peak (-2.0944 until 2026-09-17; see hs_contact_detection note)
    # Minimum dwell in Swing before a heel strike may fire, so the HS negative-peak
    # detector cannot latch onto an early-swing gyro dip.
    min_swing_dwell_ms: 330
    # Optional HS accept gate: require a RAW |accel| impact spike (m/s^2) during the
    # swing dwell before accepting a heel strike. Uses raw accel, NOT gravity-removed
    # free accel. KEEP OFF with this hardware: across the Jul 8 + Jul 13 logs (~55
    # heel strikes, both feet) real-HS impacts run 10-19 m/s^2 (only ~20% reach 20)
    # while mid-swing shake peaks hit 20-44, often exceeding the HS impact itself --
    # no threshold separates them, so the veto blocks real heel strikes and/or gets
    # pre-armed by swing shake. (Context: a mid-swing gyro dip in the 20260708_162943
    # log fired a false HS -> slip mid-swing; that dip is deeper than the true HS
    # trough on the filtered gyro, so hs_threshold tuning can't fix it either.)
    hs_accel_veto: false
    hs_impact_threshold: 20.0
    # DEPRECATED (six-state FSM): parsed for compatibility but unused.
    ts_threshold: -0.5236
    ho_threshold: -0.15
    swing_gyro_threshold: 0.8727
    midstance_threshold: 3.0

  # Moving-average window (samples) on gyro_z feeding the FSM. The (window-1)/2-
  # sample group delay is compensated for in back-dated event timestamps.
  ma_window: 5
  # Contact heel-strike detection (code default OFF = trough-recovery detector
  # above; ON here since 2026-09-17, together with to_threshold -1.75).
  # Why: on the 2026-09-15 logs the trough detector declared HS at foot-flat,
  # median 250 ms after the first ground contact (24 AfterHS slips), and ran
  # phase-inverted for 15% of HS events (5 of 24 slips fired at toe-off): one
  # weak trough flips the Stance/Swing parity until a >2 s pause.
  # When true: HS requires swing evidence (raw gyro_z > swing_gyro_min for
  # swing_min_ms), then fires on the first of a contact impact (accel change
  # >= jerk_threshold m/s^2 between consecutive samples, once gyro_z is
  # jerk_gyro_drop below its swing peak and jerk_holdoff_ms after the evidence)
  # or raw gyro_z < 0. The HS event time is the firing sample (not back-dated),
  # so measured stance times grow by ~100-150 ms vs the old detector. TO arms
  # only after foot-flat (|filtered gyro_z| < flat_gyro_max for flat_min_ms, or
  # settle_timeout_ms after HS). A flat foot for flat_reset_ms while in Swing
  # = missed landing -> RESET. hs_threshold, min_swing_dwell_ms and the accel
  # veto are unused in this mode. to_threshold: with this mode on, replay
  # (docs/to_detection_assessment_2026-09-17.txt) favours -1.75: missed
  # push-offs 57 -> 33 of 807 (12 of those are recovery steps during a slip),
  # HS results unchanged; -1.5 starts taking slap troughs for toe-offs. Do
  # NOT keep -1.75 with hs_contact_detection false (go back to -2.0944): at
  # -1.75 the old detector gets worse (right foot HS at toe-off 26 -> 64, missed push-offs 86 -> 126).
  # Replay before retuning:
  #   build/gait_fsm_replay config/motorized_shoe_params.yaml <log.csv> ...
  hs_contact_detection: true
  hs_contact:
    swing_gyro_min: 1.5
    swing_min_ms: 50
    jerk_threshold: 8.0
    jerk_gyro_drop: 0.5
    jerk_holdoff_ms: 100
    flat_gyro_max: 0.5
    flat_min_ms: 100
    settle_timeout_ms: 400
    flat_reset_ms: 200
  # DEPRECATED: gravity estimation is no longer on the FSM path (the gyro-only
  # two-state machine doesn't use free acceleration). Parsed but unused.
  gravity_calib_samples: 60

# ELMO CANopen Configuration
elmo_config:
  mode_of_operation: 0x6060
  target_velocity: 0x60FF
  status_word: 0x6041
  control_word: 0x6040
  error_code: 0x603F
  nmt_operational: 0x01
  sdo_rx_offset: 0x580
  sdo_tx_offset: 0x600
  sdo_timeout: 300
  can_write_timeout: 100
  profile_acceleration: 1000000
  profile_deceleration: 1000000
  # Statusword SDO poll period (ms). Faults are also reported instantly via
  # the drive's EMCY frame, so this is only the fallback / clear detection.
  status_poll_ms: 500
  # SYNC period (ms) for the motor-feedback TPDOs. 1 = one SYNC per 1 kHz
  # tick (~5000 frames/s on can0: both drives overran their CAN receiver,
  # EMCY 0x8110, ~1/s on 2026-09-15; 2 ms already cured it). 10 = 100 Hz
  # motor feedback, ~500 frames/s.
  sync_period_ms: 10
  # Fault recovery (runs on the command node's worker thread, never blocks
  # the 1 kHz loop): if the drive still reports a fault this long after a
  # recovery attempt finished, retry, up to fault_max_retries per episode.
  fault_retry_ms: 1000
  fault_max_retries: 5
  # Stall guard: a drive holding >= stall_current_permille with
  # |velocity| <= stall_velocity_counts (counts/s) and velocity demand 0 for
  # stall_ms is disabled (Shutdown) and logged; press 's' then 'r' to
  # re-enable. Motivation: 2026-09-15 the Right drive held ~1000 permille
  # against a wheel that never turned until it overheated (EMCY 0x4310).
  # stall_ms: 0 disables the guard.
  stall_current_permille: 800
  stall_velocity_counts: 500
  stall_ms: 2000

# Slip Perturbation (used by motorized_shoe_slip_app)
# Two modes selectable from keyboard, both one-shot per keypress:
#   mode1_key (AfterHS, backward slip): fires `mode1_delay_after_hs_ms` after the
#                next HS event.
#   mode2_key (BeforeTO, forward slip): PREDICTED, HS-anchored. On the next HS it
#                schedules the slip for t_HS + max(0, stance_est - to_slip_lead_ms)
#                so the -velocity burst lands ~to_slip_lead_ms before the predicted
#                toe-off. stance_est is a running average of measured (TO-HS)
#                stance times; a newer HS before firing cancels and reschedules.
slip_perturbation:
  enabled: true
  foot: "Right"
  slip_velocity: 200000
  slip_duration_ms: 500
  mode1_delay_after_hs_ms: 0
  # Forward-slip lead before the predicted toe-off (ms).
  to_slip_lead_ms: 50
  # Stance estimator for the forward (BeforeTO) slip. Prediction = median
  # stance FRACTION (stance / HS->HS period) over the last stance_est_window
  # clean cycles, times the period of the cycle that just completed (falls
  # back to the median absolute stance until a fraction exists). A stance is
  # "clean" only inside [stance_min_ms, stance_max_ms] with its cycle inside
  # [cycle_min_ms, cycle_max_ms]; pauses (6-32 s "stances" in the Sep 2026
  # logs) and false events (90-350 ms) are rejected instead of averaged in.
  # An HS gap above stance_est_reset_gap_ms, an FSM resync, a drive fault or
  # an emergency stop reset the estimator; it then needs
  # stance_est_warmup_cycles clean stances before mode 2 can schedule. A
  # toe-off detected before the scheduled fire cancels that slip (missed
  # trial) instead of firing with the foot in the air.
  # Replay of the Sep 2026 logs picked window 3 / warm-up 1: same accuracy as
  # the old mean-of-2 on steady walking (median error 30 ms), no seconds-late
  # or in-swing fires after pauses, fewest skipped cycles after a reset.
  stance_est_window: 3
  stance_est_warmup_cycles: 1
  stance_min_ms: 300
  stance_max_ms: 1500
  cycle_min_ms: 600
  cycle_max_ms: 2000
  stance_est_reset_gap_ms: 2500
  # DEPRECATED: superseded by to_slip_lead_ms. Parsed but unused.
  mode2_delay_after_mst_ms: 200
  # Drive profile acceleration/deceleration in slip mode (counts/sec^2).
  # Init default is 1e6 → ~150 ms ramp for a 150k slip, so most of a short
  # burst is spent ramping. 1e7 (~15 ms ramp) makes the slip onset
  # essentially instantaneous relative to the gait event.
  slip_profile_acceleration: 5000000
  mode1_key: "1"
  mode2_key: "2"

# Logging Configuration
logging:
  imu_data_log: false
  gait_phase_log: true
  elmo_command_log: true
  elmo_status_log: true
